<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Family shell: the same white rounded square (a top-to-bottom shade,
       a rim lit from above and soft drop shadow) and near-black
       round-capped strokes as overcli (a `>` prompt), overgit (a branch
       graph) and overdb (a platter stack).
       overapi's mark is a JSON object with something in it — braces
       closing on three dots: the payload an API hands back.
       16-32px sizes come from icon-small.svg instead. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f1ed"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect x="100" y="122" width="824" height="824" rx="185" ry="185" fill="#000000" fill-opacity="0.32" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#plate)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" ry="183" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <g fill="none" stroke="#111113" stroke-width="50" stroke-linecap="round" stroke-linejoin="round">
    <path d="M426 339 Q 354 339 354 411 L 354 469 Q 354 512 310 512 Q 354 512 354 555 L 354 613 Q 354 685 426 685"/>
    <path d="M598 339 Q 670 339 670 411 L 670 469 Q 670 512 714 512 Q 670 512 670 555 L 670 613 Q 670 685 598 685"/>
  </g>
  <g fill="#111113">
    <circle cx="440" cy="512" r="30"/>
    <circle cx="512" cy="512" r="30"/>
    <circle cx="584" cy="512" r="30"/>
  </g>
</svg>
